# Dependabot version updates — free for all GitHub repos.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Python deps — pyproject.toml + uv.lock at the repo root.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Docs site — docs-site/package.json + package-lock.json.
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by our workflows (.github/workflows/).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"

  # Base images pinned in the Dockerfile (uv base, nodesource, etc.).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
