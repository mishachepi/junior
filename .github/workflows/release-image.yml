name: Release image

# Build and push the `full` multi-arch image to Docker Hub on a version tag
# (e.g. `0.2.5`), or manually with an explicit version.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and tag (e.g. 0.2.5)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches pyproject version
        if: github.event_name == 'push'
        run: |
          file_ver=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$file_ver" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::pyproject version ($file_ver) != tag (${{ steps.ver.outputs.version }})"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # provenance/sbom off: buildx attestations create an OCI index some
      # registries reject on push.
      - name: Build and push (full, multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            mihchepi/junior:${{ steps.ver.outputs.version }}
            mihchepi/junior:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
