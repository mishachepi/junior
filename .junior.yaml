# Dogfooding: Junior reviews its own diff.
#   junior dry-run          → preview exactly what the AI would see (no call)
#   junior run              → structured JSON verdict to stdout
#   junior run --publish    → render the review as Markdown (redirect with > to save)
runbook: local_review
harness: claudecode

# Prompts are scoped per runbook (scion-style): the review rules below apply
# ONLY to local_review — a `junior run --runbook changelog` in this repo won't
# drag code-review instructions (and their token bill) into an unrelated task.
# Truly global prompts (style, language) would go under `context.prompts`.
runbooks:
  local_review:
    prompts:
      - file://./.junior/prompts/review.md
