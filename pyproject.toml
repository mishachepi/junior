[project]
name = "junior"
version = "0.3.0"
description = "Deterministic LLM runbook framework like dynamic workflows. Includes built-in AI code review tooling."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "structlog>=26.1.0",
    "questionary>=2.1.1",
    "typer>=0.27.3",
    "rich>=15.0.0",
    "PyYAML>=6.0",
    "pydantic-ai-slim[anthropic,openai]>=2.51.0",  # the default harness: one structured API call
]

[project.optional-dependencies]
# --- Agent backends ---
pydantic = []  # default — ships in core (pydantic-ai); kept so `junior[pydantic]` still installs
claudecode = []  # drives the `claude` CLI (Node.js), no Python deps
codex = ["openai>=3.31.0"]  # drives the `codex` CLI (Node.js); openai = strict-schema helper

# --- Built-in platforms for code review collect MR/PR metadata + publish comments ---
gitlab = ["python-gitlab>=8.6.0"]
github = ["httpx>=0.28"]  # + `gh` CLI authenticated
bitbucket = ["httpx>=0.28"]  # Bitbucket Data Center (self-hosted)

# --- Convenience ---
all = ["junior[gitlab,github,bitbucket,codex,pydantic]"]

# Dev tooling is a PEP 735 dependency group (not an extra): uv installs the
# `dev` group by default, so a plain `uv run pytest` works on a fresh clone.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[project.scripts]
junior = "junior.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/junior"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
