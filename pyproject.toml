[project]
name = "junior"
version = "0.2.4"
description = "Deterministic LLM runbook framework like dynamic workflows. Includes built-in AI code review tooling."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.13",
    "structlog>=25.0",
    "questionary>=2.1.1",
    "typer>=0.15",
    "rich>=15.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# --- Agent backends ---
claudecode = []  # default — drives the `claude` CLI (Node.js), no Python deps
codex = ["openai>=2.48.0"]  # drives the `codex` CLI (Node.js); openai = strict-schema helper
pydantic = ["pydantic-ai-slim[anthropic,openai]>=2.17.0"]  # single structured call via API key
deepagents = [
    "deepagents>=0.4.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
]

# --- Built-in platforms for code review collect MR/PR metadata + publish comments ---
gitlab = ["python-gitlab>=8.4.0"]
github = ["httpx>=0.28"]  # + `gh` CLI authenticated
bitbucket = ["httpx>=0.28"]  # Bitbucket Data Center (self-hosted)

# --- Convenience ---
all = ["junior[gitlab,github,bitbucket,codex,pydantic,deepagents]"]

# Dev tooling is a PEP 735 dependency group (not an extra): uv installs the
# `dev` group by default, so a plain `uv run pytest` works on a fresh clone.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15",
    "pytest-cov>=7.0",
    "ruff>=0.16.0",
]

[project.scripts]
junior = "junior.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/junior"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
